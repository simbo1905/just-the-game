name: CI (Build & Test)

on:
  pull_request:
  push:
    branches: [ main ]
    # Docs-only pushes to main skip the full Rust build + headless Chrome suite.
    # pull_request stays unfiltered so every PR is still fully verified.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Cancel superseded runs for the same ref, so a burst of pushes does not pay for
# several concurrent Rust + Chrome test runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v1

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build tools (release)
        run: just tools-build

      - name: Install tools to .tools
        run: just tools-install-local

      - name: Build (validate + bundle)
        run: just build

      - name: Test (headless)
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: just test



